<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Tip Calculator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h3>ITMD-541 - Lab3 - Sandeep Mangadu Aravind</h3>
        <h3>Tip Calculator</h3>
        <form id="tipForm">
            <div class="form-group">
                <label for="billTotal">Bill Total ($):</label>
                <input type="number" id="billTotal" oninput="calculateTip()" placeholder="Enter bill amount">
                <span id="billError" class="error-message"></span>
            </div>
            
            <div class="form-group">
                <label for="currency">Select Currency:</label>
                <select id="currency" onchange="calculateTip()">
                    <option value="USD">USD ($)</option>
                    <option value="INR">Indian Rupee (₹)</option>
                    <option value="JPY">Japanese Yen (¥)</option>
                </select>
            </div> 
            
            <div class="form-group">
                <label for="tipPercentageInput">Tip Percentage:</label>
                <input type="number" id="tipPercentageInput" min="0" max="100" value="10" oninput="syncTipSlider()" class="short-input">
                <input type="range" id="tipPercentage" min="0" max="100" value="10" oninput="syncTipInput()">
            </div>
            
            <div class="form-group">
                <label for="convertedTipAmount">Converted Tip Amount:</label>
                <input type="text" id="convertedTipAmount" disabled>
            </div>
            
            <div class="form-group">
                <label for="convertedTotalBill">Converted Total Bill with Tip:</label>
                <input type="text" id="convertedTotalBill" disabled>
            </div>
            
            <div class="currency-info">
                <p><strong>Currency conversion rates:</strong></p>
                <p>$1 USD = 149.34 JPY</p>
                <p>$1 USD = ₹84.07 INR</p>
            </div>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
